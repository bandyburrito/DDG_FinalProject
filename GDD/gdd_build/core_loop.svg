<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Core Loop — Micro / Macro / Meta</text>

  <!-- MICRO LOOP -->
  <g>
    <rect x="20" y="60" width="860" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="40" y="84" font-size="14" font-weight="700" fill="#0C447C">MICRO LOOP — one turn</text>

    <!-- Boxes -->
    <g font-size="13" fill="#1a1a1a">
      <rect x="50"  y="105" width="120" height="60" rx="6" fill="white" stroke="#185FA5"/>
      <text x="110" y="132" text-anchor="middle">Player</text>
      <text x="110" y="150" text-anchor="middle">Moves</text>

      <rect x="200" y="105" width="120" height="60" rx="6" fill="white" stroke="#185FA5"/>
      <text x="260" y="132" text-anchor="middle">Trap Check</text>
      <text x="260" y="150" text-anchor="middle">on arrival</text>

      <rect x="350" y="105" width="120" height="60" rx="6" fill="white" stroke="#185FA5"/>
      <text x="410" y="132" text-anchor="middle">Attack</text>
      <text x="410" y="150" text-anchor="middle">Melee / Ranged</text>

      <rect x="500" y="105" width="120" height="60" rx="6" fill="white" stroke="#185FA5"/>
      <text x="560" y="132" text-anchor="middle">End Turn</text>
      <text x="560" y="150" text-anchor="middle">Space key</text>

      <rect x="650" y="105" width="200" height="60" rx="6" fill="#185FA5" stroke="#0C447C"/>
      <text x="750" y="132" text-anchor="middle" fill="white">Enemies execute</text>
      <text x="750" y="150" text-anchor="middle" fill="white">telegraphed plan</text>
    </g>

    <!-- Arrows micro -->
    <g stroke="#444" stroke-width="1.5" fill="none">
      <line x1="170" y1="135" x2="200" y2="135" marker-end="url(#arr)"/>
      <line x1="320" y1="135" x2="350" y2="135" marker-end="url(#arr)"/>
      <line x1="470" y1="135" x2="500" y2="135" marker-end="url(#arr)"/>
      <line x1="620" y1="135" x2="650" y2="135" marker-end="url(#arr)"/>
      <!-- loop back -->
      <path d="M750 165 Q750 188 110 188 Q110 175 110 165" marker-end="url(#arr)"/>
    </g>
  </g>

  <!-- MACRO LOOP -->
  <g>
    <rect x="20" y="220" width="860" height="140" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="40" y="244" font-size="14" font-weight="700" fill="#27500A">MACRO LOOP — one wave</text>

    <g font-size="13" fill="#1a1a1a">
      <rect x="50"  y="265" width="140" height="60" rx="6" fill="white" stroke="#3B6D11"/>
      <text x="120" y="292" text-anchor="middle">All enemies</text>
      <text x="120" y="310" text-anchor="middle">defeated</text>

      <rect x="220" y="265" width="130" height="60" rx="6" fill="white" stroke="#3B6D11"/>
      <text x="285" y="292" text-anchor="middle">75% heal</text>
      <text x="285" y="310" text-anchor="middle">of wave dmg</text>

      <rect x="380" y="265" width="140" height="60" rx="6" fill="white" stroke="#3B6D11"/>
      <text x="450" y="292" text-anchor="middle">+25% Melee or</text>
      <text x="450" y="310" text-anchor="middle">+25% Ranged</text>

      <rect x="550" y="265" width="140" height="60" rx="6" fill="white" stroke="#3B6D11" stroke-dasharray="4 3"/>
      <text x="620" y="288" text-anchor="middle">Companion pick</text>
      <text x="620" y="306" text-anchor="middle" font-size="11" fill="#5F5E5A">waves 3 / 6 / 9</text>

      <rect x="720" y="265" width="130" height="60" rx="6" fill="#3B6D11" stroke="#27500A"/>
      <text x="785" y="292" text-anchor="middle" fill="white">New room</text>
      <text x="785" y="310" text-anchor="middle" fill="white">generates</text>
    </g>

    <g stroke="#444" stroke-width="1.5" fill="none">
      <line x1="190" y1="295" x2="220" y2="295" marker-end="url(#arr)"/>
      <line x1="350" y1="295" x2="380" y2="295" marker-end="url(#arr)"/>
      <line x1="520" y1="295" x2="550" y2="295" marker-end="url(#arr)"/>
      <line x1="690" y1="295" x2="720" y2="295" marker-end="url(#arr)"/>
      <path d="M785 325 Q785 348 120 348 Q120 335 120 325" marker-end="url(#arr)"/>
    </g>
  </g>

  <!-- META LOOP -->
  <g>
    <rect x="20" y="380" width="860" height="140" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
    <text x="40" y="404" font-size="14" font-weight="700" fill="#72243E">META LOOP — full run</text>

    <g font-size="13" fill="#1a1a1a">
      <rect x="50"  y="425" width="160" height="60" rx="6" fill="white" stroke="#993556"/>
      <text x="130" y="452" text-anchor="middle">Wave N</text>
      <text x="130" y="470" text-anchor="middle" font-size="11" fill="#5F5E5A">N ≤ 10</text>

      <rect x="240" y="425" width="180" height="60" rx="6" fill="white" stroke="#993556"/>
      <text x="330" y="448" text-anchor="middle">Stack multipliers</text>
      <text x="330" y="466" text-anchor="middle">+ companions</text>
      <text x="330" y="481" text-anchor="middle" font-size="11" fill="#5F5E5A">HP carries over</text>

      <rect x="450" y="425" width="160" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
      <text x="530" y="452" text-anchor="middle" font-weight="700" fill="#27500A">WIN</text>
      <text x="530" y="470" text-anchor="middle" font-size="11" fill="#27500A">10 waves cleared</text>

      <rect x="640" y="425" width="180" height="60" rx="6" fill="#FCEBEB" stroke="#A32D2D"/>
      <text x="730" y="452" text-anchor="middle" font-weight="700" fill="#791F1F">LOSS</text>
      <text x="730" y="470" text-anchor="middle" font-size="11" fill="#791F1F">Shoki HP reaches 0</text>
    </g>

    <g stroke="#444" stroke-width="1.5" fill="none">
      <line x1="210" y1="455" x2="240" y2="455" marker-end="url(#arr)"/>
      <line x1="420" y1="455" x2="450" y2="455" marker-end="url(#arr)"/>
      <path d="M330 425 Q330 410 330 405" stroke-dasharray="3 3"/>
      <line x1="610" y1="455" x2="640" y2="455" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    </g>
  </g>
</svg>
